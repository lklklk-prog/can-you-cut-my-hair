<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я голоден</title>
    
    <!-- Skull Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💀</text></svg>">
    
    <!-- Fira Code Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MAIN CONTENT CONTAINER -->
    <div class="main-content">
        <!-- QUESTION STAGE -->
        <div id="questionStage" class="stage-box">
            <h1 id="questionHeading" class="question-text">can u cut my hair??</h1>

            <div class="horizontal-buttons">
                <button id="btnYes" class="btn btn-yes">YES</button>
                <button id="btnNo" class="btn btn-no">NO</button>
            </div>
        </div>

        <!-- SUCCESS STAGE -->
        <div id="successStage" class="stage-box hidden">
            <p class="yippee-subtext">YIPPEEEEEEEEEEEEEEEEEE</p>
            
            <!-- YIPPEE CREATURE IMAGE WRAPPER -->
            <div class="yippee-wrapper" id="yippeeWrapper">
                <img src="yippee.png" alt="yippee creature" class="yippee-img" id="yippeeImg">
                <canvas id="localConfettiCanvas"></canvas>
            </div>

            <!-- QUESTION BELOW YIPPEE CREATURE -->
            <p class="day-question-text">What do you think of Sunday or Monday??</p>

            <button id="btnReplay" class="btn btn-reset">reset</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
